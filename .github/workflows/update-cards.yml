name: 同步卡库

# 定时说明：GitHub 的 cron 一律用 UTC，北京时间 = UTC + 8
#   0 2,12,22 * * *  ->  UTC 02:00 / 12:00 / 22:00  ->  北京 10:00 / 20:00 / 次日 06:00
# 若想改成 UTC 每 10 小时整点（北京 08/18/04），把上面这行换成：0 */10 * * *
on:
  schedule:
    - cron: "0 2,12,22 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动点一下运行

permissions:
  contents: write # 没有这行 git push 会被 403 挡住

concurrency:
  group: update-cards
  cancel-in-progress: false # 上一轮没跑完就排队，不并发

jobs:
  update:
    # 固定 24.04，不用 ubuntu-latest：latest 会在 2026-10 之后迁到 Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: 下载官方卡库
        # 原始卡库不放在仓库里（11 MB，且只是构架索引的输入），每次现下到 /tmp
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/cards.json \
            "https://api.hearthstonejson.com/v1/latest/zhCN/cards.json"
          ls -lh /tmp/cards.json

      - name: 比对指纹
        id: diff
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          new = json.loads(pathlib.Path("/tmp/cards.json").read_text(encoding="utf-8"))
          fp_path = pathlib.Path("data/cards-fingerprint.txt")

          # 只用真正影响展示的字段做指纹，避免无关字段抖动造成“假变化”
          def fp(cards):
              key = sorted(
                  (c.get("dbfId", 0), c.get("id", ""), c.get("name", ""),
                   c.get("cost"), c.get("text", ""), c.get("set", ""))
                  for c in cards
              )
              return hashlib.sha256(repr(key).encode()).hexdigest()

          new_fp = fp(new)
          old_fp = fp_path.read_text(encoding="utf-8").strip() if fp_path.exists() else ""

          changed = "0"
          if old_fp != new_fp:
              fp_path.write_text(new_fp + "\n", encoding="utf-8")

              # 总张数写进 meta.json（首屏包与边缘函数都读它）
              meta_p = pathlib.Path("data/meta.json")
              meta = json.loads(meta_p.read_text(encoding="utf-8"))
              meta.setdefault("counts", {})["total"] = len(new)
              meta_p.write_text(
                  json.dumps(meta, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )

              # 出现没登记过的新系列时只报警告：中文名没法自动生成，需要人工补 data/meta.json
              known = {code for group in meta["sets"] for code, _ in group["items"]}
              unknown = sorted({c.get("set", "") for c in new} - known - {""})
              if unknown:
                  print(f"::warning::发现未登记系列：{', '.join(unknown)}，请补 data/meta.json")

              print(f"有变化：{len(new)} 张")
              changed = "1"
          else:
              print(f"无实质变化，仍是 {len(new)} 张")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"changed={changed}\n")
          PY

      - name: 重建索引与首屏包
        if: steps.diff.outputs.changed == '1'
        # 卡库变了就要一起重建 data/cards-lite.json 与 data/first.json，否则前端与边缘函数用的还是旧数据
        run: |
          node --version
          CARD_SOURCE=/tmp/cards.json node scripts/build-index.mjs

      - name: 提交并推送
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards-lite.json data/first.json data/meta.json data/cards-fingerprint.txt
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "data: 同步卡库 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
